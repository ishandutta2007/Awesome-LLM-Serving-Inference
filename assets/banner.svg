<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a11" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      letter-spacing: -1px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    
    /* Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.08); }
    }
    @keyframes beamFlow {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(40px, -25px); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-35px, 20px); }
    }
    @keyframes pillBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    .ambient-glow-1 {
      animation: pulseGlow 8s ease-in-out infinite, floatOrb1 12s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .ambient-glow-2 {
      animation: pulseGlow 10s ease-in-out infinite 2s, floatOrb2 14s ease-in-out infinite;
      transform-origin: 950px 240px;
    }
    .dynamic-beam {
      stroke-dasharray: 80 180;
      animation: beamFlow 7s linear infinite;
    }
    .dynamic-beam-rev {
      stroke-dasharray: 60 140;
      animation: beamFlow 5s linear infinite reverse;
    }
    .pill-1 { animation: pillBob 4s ease-in-out infinite; }
    .pill-2 { animation: pillBob 4.5s ease-in-out infinite 0.8s; }
    .pill-3 { animation: pillBob 5s ease-in-out infinite 1.6s; }
    .pill-4 { animation: pillBob 4.8s ease-in-out infinite 2.2s; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Background Dynamic Ambient Orbs (strictly background) -->
  <g opacity="0.6">
    <circle class="ambient-glow-1" cx="200" cy="90" r="140" fill="url(#glow-grad)" filter="url(#neon-glow)" />
    <circle class="ambient-glow-2" cx="980" cy="240" r="180" fill="url(#glow-grad)" filter="url(#neon-glow)" />
  </g>

  <!-- Decorative Matrix Grid (Background) -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Dynamic Animated Data Flows / Waveform Rays (Background layer) -->
  <g opacity="0.45" fill="none">
    <path class="dynamic-beam" d="M -50,300 C 250,320 350,180 650,220 C 950,260 1050,120 1250,150" stroke="#38bdf8" stroke-width="2.5" />
    <path class="dynamic-beam-rev" d="M -50,80 C 280,40 420,180 750,120 C 1000,70 1100,220 1250,200" stroke="#c084fc" stroke-width="2" />
    <path class="dynamic-beam" d="M -50,200 C 300,240 500,80 800,160 C 1050,230 1150,100 1250,80" stroke="#818cf8" stroke-width="1.5" />
  </g>

  <!-- Floating Tech Ecosystem Pills (Positioned around borders to avoid title/subtitle) -->
  <g class="pill-1">
    <rect x="70" y="40" width="130" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.85"/>
    <circle cx="88" cy="56" r="4" fill="#38bdf8" />
    <text x="100" y="61" fill="#e2e8f0" class="badge-text">vLLM ⚡</text>
  </g>

  <g class="pill-2">
    <rect x="1000" y="45" width="135" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.85"/>
    <circle cx="1018" cy="61" r="4" fill="#818cf8" />
    <text x="1030" y="66" fill="#e2e8f0" class="badge-text">TensorRT-LLM</text>
  </g>

  <g class="pill-3">
    <rect x="65" y="285" width="140" height="32" rx="16" fill="#1e293b" stroke="#f472b6" stroke-width="1.2" opacity="0.85"/>
    <circle cx="83" cy="301" r="4" fill="#f472b6" />
    <text x="95" y="306" fill="#e2e8f0" class="badge-text">SGLang 🚀</text>
  </g>

  <g class="pill-4">
    <rect x="990" y="285" width="145" height="32" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" opacity="0.85"/>
    <circle cx="1008" cy="301" r="4" fill="#a855f7" />
    <text x="1020" y="306" fill="#e2e8f0" class="badge-text">llama.cpp / Ollama</text>
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed pristine contrast & clear hierarchy -->
  <g id="foreground-content">
    <!-- Category Mini-Header Badge -->
    <rect x="440" y="55" width="320" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <text x="600" y="74" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" letter-spacing="1.5" text-anchor="middle">CURATED ECOSYSTEM GUIDE • 2026</text>

    <!-- Main Title with Gradient Fill -->
    <text x="600" y="150" text-anchor="middle" class="title-text" fill="url(#accent-grad)">
      Awesome LLM Serving &amp; Inference
    </text>

    <!-- Subtitle (Clear in Foreground) -->
    <text x="600" y="195" text-anchor="middle" class="subtitle-text">
      Production-Grade LLM Serving Engines, Inference Frameworks &amp; Managed GPU SaaS
    </text>

    <!-- Secondary Meta Text / Highlights -->
    <text x="600" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#64748b" font-weight="500">
      ⚡ High-Throughput KV Caching • 🎯 Disaggregated Prefill-Decode • 🌐 Multi-GPU Scaling
    </text>
  </g>

  <!-- Sleek Border Frame -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#334155" stroke-width="1" opacity="0.6" />
</svg>
