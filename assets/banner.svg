<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#070a11"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="40%" stop-color="#818cf8"/><stop offset="80%" stop-color="#c084fc"/><stop offset="100%" stop-color="#f472b6"/></linearGradient><linearGradient id="glow-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".3"/><stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/></linearGradient><filter id="neon-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulseGlow{0%{opacity:.25;transform:scale(1)}50%{opacity:.5;transform:scale(1.08)}}@keyframes beamFlow{0%{stroke-dashoffset:600}}@keyframes floatOrb1{0%{transform:translate(0,0)}50%{transform:translate(40px,-25px)}}@keyframes floatOrb2{0%{transform:translate(0,0)}50%{transform:translate(-35px,20px)}}@keyframes pillBob{0%{transform:translateY(0)}50%{transform:translateY(-5px)}}.title-text{font-weight:800;font-size:52px;letter-spacing:-1px}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-weight:400;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;letter-spacing:.5px}.ambient-glow-1{animation:pulseGlow 8s ease-in-out infinite,floatOrb1 12s ease-in-out infinite;transform-origin:200px 100px}.ambient-glow-2{animation:pulseGlow 10s ease-in-out infinite 2s,floatOrb2 14s ease-in-out infinite;transform-origin:950px 240px}.dynamic-beam{stroke-dasharray:80 180;animation:beamFlow 7s linear infinite}.dynamic-beam-rev{stroke-dasharray:60 140;animation:beamFlow 5s linear infinite reverse}.pill-1{animation:pillBob 4s ease-in-out infinite}.pill-2{animation:pillBob 4.5s ease-in-out infinite .8s}.pill-3{animation:pillBob 5s ease-in-out infinite 1.6s}.pill-4{animation:pillBob 4.8s ease-in-out infinite 2.2s}</style><rect width="1200" height="360" fill="url(#bg-grad)" rx="16"/><g opacity=".6"><circle cx="200" cy="90" r="140" fill="url(#glow-grad)" class="ambient-glow-1" filter="url(#neon-glow)"/><circle cx="980" cy="240" r="180" fill="url(#glow-grad)" class="ambient-glow-2" filter="url(#neon-glow)"/></g><g stroke="#fff" stroke-width="1" opacity=".08"><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="300" y2="300"/><line x1="200" x2="200" y1="0" y2="360"/><line x1="400" x2="400" y1="0" y2="360"/><line x1="600" x2="600" y1="0" y2="360"/><line x1="800" x2="800" y1="0" y2="360"/><line x1="1000" x2="1000" y1="0" y2="360"/></g><g fill="none" opacity=".45"><path stroke="#38bdf8" stroke-width="2.5" d="M -50,300 C 250,320 350,180 650,220 C 950,260 1050,120 1250,150" class="dynamic-beam"/><path stroke="#c084fc" stroke-width="2" d="M -50,80 C 280,40 420,180 750,120 C 1000,70 1100,220 1250,200" class="dynamic-beam-rev"/><path stroke="#818cf8" stroke-width="1.5" d="M -50,200 C 300,240 500,80 800,160 C 1050,230 1150,100 1250,80" class="dynamic-beam"/></g><g class="pill-1"><rect width="130" height="32" x="70" y="40" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity=".85" rx="16"/><circle cx="88" cy="56" r="4" fill="#38bdf8"/><text x="100" y="61" fill="#e2e8f0" class="badge-text">vLLM ⚡</text></g><g class="pill-2"><rect width="135" height="32" x="1000" y="45" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity=".85" rx="16"/><circle cx="1018" cy="61" r="4" fill="#818cf8"/><text x="1030" y="66" fill="#e2e8f0" class="badge-text">TensorRT-LLM</text></g><g class="pill-3"><rect width="140" height="32" x="65" y="285" fill="#1e293b" stroke="#f472b6" stroke-width="1.2" opacity=".85" rx="16"/><circle cx="83" cy="301" r="4" fill="#f472b6"/><text x="95" y="306" fill="#e2e8f0" class="badge-text">SGLang 🚀</text></g><g class="pill-4"><rect width="145" height="32" x="990" y="285" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" opacity=".85" rx="16"/><circle cx="1008" cy="301" r="4" fill="#a855f7"/><text x="1020" y="306" fill="#e2e8f0" class="badge-text">llama.cpp / Ollama</text></g><g id="foreground-content"><rect width="320" height="28" x="440" y="55" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" rx="14"/><text x="600" y="74" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">CURATED ECOSYSTEM GUIDE • 2026</text><text x="600" y="150" fill="url(#accent-grad)" class="title-text" text-anchor="middle">Awesome LLM Serving &amp; Inference</text><text x="600" y="195" class="subtitle-text" text-anchor="middle">Production-Grade LLM Serving Engines, Inference Frameworks &amp; Managed GPU SaaS</text><text x="600" y="235" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" text-anchor="middle">⚡ High-Throughput KV Caching • 🎯 Disaggregated Prefill-Decode • 🌐 Multi-GPU Scaling</text></g><rect width="1198" height="358" x="1" y="1" fill="none" stroke="#334155" stroke-width="1" opacity=".6" rx="15"/></svg>